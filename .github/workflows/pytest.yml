name: pytest

# Reusable test workflow, called by release.yml to gate a publish on green
# tests. Normal push/PR testing is handled by workspace-ci.yml; this one is
# workflow_call-only so it doesn't double-run on every push.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install uv
        run: pip install uv
      - name: Set up venv and install
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --color=yes
